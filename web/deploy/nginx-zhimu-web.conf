# 智牧通 Web 站点（用户端 + 管理端）Nginx 配置
# 域名/IP 均可使用：server_name _ 表示接任意 Host。
# 目录约定：
#   /var/www/zhimu/          Web 用户端（apps/user/dist 内容）
#   /var/www/zhimu/admin/    Web 管理端（apps/admin/dist 内容）
# 访问：
#   http://<公网IP>/         用户端登录
#   http://<公网IP>/admin/   管理端登录（后台）

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/zhimu;
    index index.html;

    charset utf-8;
    client_max_body_size 64m;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HTTPS 时再开启：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- 管理端接口（必须放在 /admin/ 静态之前） ----------
    location /admin/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- AI 流式问答（关闭缓冲，超时 180s） ----------
    location /api/v1/ai/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ---------- 用户端接口 ----------
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 课程 HLS（MinIO 公开只读桶） ----------
    location /hls/ {
        proxy_pass http://127.0.0.1:9000/zmt-course/hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ---------- 静态资源缓存 ----------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /admin/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- 管理端 SPA（后台） ----------
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store" always;
    }

    # ---------- 用户端 SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    # gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
