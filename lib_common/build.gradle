apply from: rootProject.file('gradle/lib-component.gradle')

def props = rootProject.ext.localProps
// 测试直连（2026-10-22 确认）：Key 只进 debug 包，release 包为空，直连自动关闭、走服务端接口
def directFields = [
        DASHSCOPE_API_KEY    : props.getProperty('ai.dashscopeKey', ''),
        DASHSCOPE_MODEL      : props.getProperty('ai.dashscopeModel', 'qwen3.8-max'),
        // 模块11 K01 语音识别模型；为空时 AiDirectConfig.speechModel() 用代码中的默认值 qwen3-asr-flash
        DASHSCOPE_ASR_MODEL  : props.getProperty('ai.dashscopeAsrModel', ''),
        DEEPSEEK_API_KEY     : props.getProperty('ai.deepseekKey', ''),
        DEEPSEEK_MODEL       : props.getProperty('ai.deepseekModel', 'deepseek-flash'),
        ALIYUN_ACCESS_KEY_ID : props.getProperty('aliyun.accessKeyId', ''),
        ALIYUN_ACCESS_SECRET : props.getProperty('aliyun.accessKeySecret', ''),
        ALIYUN_SMS_SIGN_NAME : props.getProperty('aliyun.smsSignName', ''),
        // Mock 模式下的“今天”（与示例数据一致）；填空则用真实日期
        MOCK_TODAY           : props.getProperty('zmt.mockToday', '2026-10-19')
]

android {
    namespace 'com.zhimu.slmp.common'

    buildTypes {
        debug {
            directFields.each { k, v -> buildConfigField 'String', k, "\"${v}\"" }
        }
        release {
            directFields.each { k, v -> buildConfigField 'String', k, '""' }
        }
    }
}

dependencies {
    api project(':lib_base')
    api project(':lib_network')
    annotationProcessor libs.dagger.compiler

    testImplementation libs.junit
    testImplementation libs.core.testing
    testImplementation libs.mockito.core
}
