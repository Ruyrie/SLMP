plugins {
    alias(libs.plugins.android.application)
}
apply from: rootProject.file('gradle/android-common.gradle')

def bizModules = ['module_account', 'module_farm', 'module_today', 'module_herd',
                  'module_breed', 'module_feed', 'module_inspect', 'module_health',
                  'module_stock', 'module_finance', 'module_ai']
def props = rootProject.ext.localProps

android {
    namespace 'com.zhimu.slmp'

    defaultConfig {
        applicationId "com.zhimu.slmp"
        targetSdk = 36
        versionCode 10000
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // 正式签名只在负责发布的组员电脑上配置（local.properties：release.storeFile 等）
            if (props.getProperty('release.storeFile')) {
                storeFile file(props.getProperty('release.storeFile'))
                storePassword props.getProperty('release.storePassword')
                keyAlias props.getProperty('release.keyAlias')
                keyPassword props.getProperty('release.keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (props.getProperty('release.storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// 极光要求 JPUSH_PKGNAME 与实际包名一致（debug 包带 .debug 后缀）
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.manifestPlaceholders.put('JPUSH_PKGNAME', variant.applicationId)
    }
}

dependencies {
    implementation project(':lib_common')
    implementation project(':lib_media')
    implementation project(':lib_map')
    // 单独运行中的业务组件不参与壳工程构建
    bizModules.each { m ->
        if (!rootProject.ext.isRunAlone(m)) {
            implementation project(":${m}")
        }
    }
    implementation libs.core.splashscreen
    annotationProcessor libs.dagger.compiler
    debugImplementation libs.leakcanary

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
