// 全部组件共用的 Android 配置：SDK 版本、Java 17、构建功能、BuildConfig 字段与清单占位符。
// 由 gradle/lib-component.gradle、gradle/biz-component.gradle 与 app/build.gradle 在应用插件之后引入。
def props = rootProject.ext.localProps

android {
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdk = 31
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 高德 SDK 只提供 ARM 原生库；只打包 ARM 两种 ABI，x86_64 模拟器通过 ARM 转译运行
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // 服务端地址与 Mock 开关（local.properties：zmt.baseUrl、zmt.useMock）
        buildConfigField "String", "BASE_URL", "\"${props.getProperty('zmt.baseUrl', 'https://api.zhimutong.example.com/')}\""
        buildConfigField "boolean", "USE_MOCK", "${props.getProperty('zmt.useMock', 'true')}"
        buildConfigField "String", "APP_VERSION_NAME", "\"${rootProject.findProperty('zmt.versionName') ?: '1.0.0'}\""

        // Debug 第三方 Key（local.properties：amap.key、jpush.appKey），Release 在下方单独配置
        // 极光 AppKey 绑定包名：jpush.appKey 对应 debug 包 com.zhimu.slmp.debug；release 包用 jpush.releaseAppKey（见下方 buildTypes）
        buildConfigField "String", "AMAP_KEY", "\"${props.getProperty('amap.key', '')}\""
        buildConfigField "String", "JPUSH_APPKEY", "\"${props.getProperty('jpush.appKey', '')}\""
        manifestPlaceholders.putAll([
                AMAP_KEY     : props.getProperty('amap.key', ''),
                JPUSH_APPKEY : props.getProperty('jpush.appKey', ''),
                JPUSH_CHANNEL: 'developer-default',
                JPUSH_PKGNAME: 'com.zhimu.slmp'
        ])
    }

    buildTypes {
        release {
            // 高德 Key 绑定包名和签名 SHA1，Release 不复用 Debug Key
            buildConfigField "String", "AMAP_KEY", "\"${props.getProperty('amap.releaseKey', '')}\""
            manifestPlaceholders.put('AMAP_KEY', props.getProperty('amap.releaseKey', ''))
            // release 包名 com.zhimu.slmp 需在极光另建应用；未填写时不初始化推送
            buildConfigField "String", "JPUSH_APPKEY", "\"${props.getProperty('jpush.releaseAppKey', '')}\""
            manifestPlaceholders.put('JPUSH_APPKEY', props.getProperty('jpush.releaseAppKey', ''))
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}
