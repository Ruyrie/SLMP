# 数据层与基础设施测试：本机 MySQL 的 zhimu_test 库、本机 Redis database 15。
# 数据库账号密码取 server/.env.local（DB_USER、DB_PASSWORD），代码中不写密码。
spring.config.import=optional:file:../.env.local[.properties]
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/zhimu_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=15
spring.data.redis.timeout=3s
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.configuration.map-underscore-to-camel-case=true
