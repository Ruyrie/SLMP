pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SLMP"

// 壳工程
include ':app'

// 基础组件
include ':lib_base'
include ':lib_network'
include ':lib_common'
include ':lib_media'
include ':lib_map'

// 业务组件（其余 3 个组件在后续迭代中加入）
include ':module_account'
include ':module_farm'
include ':module_today'
include ':module_herd'
include ':module_breed'
include ':module_feed'
include ':module_inspect'
include ':module_health'
include ':module_stock'
include ':module_finance'
include ':module_ai'
